<text x="190" y="86" font-family="'Inter','Segoe UI',system-ui,sans-serif"><tspan font-size="28" fill="#6b7280">Hey there &#128075; I'm </tspan><tspan font-size="46" font-weight="800" fill="url(#g)">Neha Nakrani</tspan></text>
